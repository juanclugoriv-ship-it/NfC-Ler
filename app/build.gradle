plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.example.nfcemulator'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.nfcemulator"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
}
